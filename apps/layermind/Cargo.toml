[package]
name = "layermind"
version = "0.2.0"
edition = "2021"
description = "LayerMind runtime — AI-powered operating system for additive manufacturing"

[[bin]]
name = "layermind"
path = "src/main.rs"

[dependencies]
layermind-shared = { path = "../../crates/shared" }
layermind-config = { path = "../../crates/config" }
layermind-logging = { path = "../../crates/logging" }
layermind-moonraker = { path = "../../crates/moonraker" }
layermind-printer = { path = "../../crates/printer" }
layermind-telemetry = { path = "../../crates/telemetry" }
layermind-database = { path = "../../crates/database" }
layermind-ai = { path = "../../crates/ai" }
layermind-analyzer = { path = "../../crates/analyzer" }
layermind-knowledge = { path = "../../crates/knowledge" }
layermind-context = { path = "../../crates/context" }
layermind-reasoning = { path = "../../crates/reasoning" }
layermind-machine = { path = "../../crates/machine" }
layermind-history = { path = "../../crates/history" }
layermind-core = { path = "../../crates/core" }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"