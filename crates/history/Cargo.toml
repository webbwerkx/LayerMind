[package]
name = "layermind-history"
version = "0.1.0"
edition = "2021"
description = "Historical timeline engine — immutable event recording, snapshots, diffs, queries"

[dependencies]
layermind-shared = { path = "../shared" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }